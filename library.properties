sentence=Ultra-fast 2-in-1 OLED library (zero-buffer or 1KB smart-dirty buffer) for SSD1306/SSD1309.
paragraph=Lightweight and ultra-fast OLED display library built on microWire (AVR) and Wire (ESP32/ESP8266). Supports both zero-buffer streaming mode (0 bytes RAM) and 1KB frame-buffer mode with smart dirty-rectangle update(), pixel-accurate fonts/bitmaps, Bresenham lines, filled/stroked circles and rectangles, font scaling (1x/2x/4x), and non-blocking pixel-smooth ticker with UTF-8/CP866 auto-detection.
